; EOS credentials template - copy to eos_credentials.cfg (project root) or
; user://eos_credentials.cfg and fill in the values from your EOS Developer
; Portal product. The real file is git-ignored; NEVER commit secrets.
;
; Every key below defaults to what scripts/online/online_credentials.gd
; expects. See ONLINE_SETUP.md for the full setup walkthrough.

[eos]
product_name="Tetris Yank Edition"
product_version="1.0.0"
; From Developer Portal: Product Settings -> General (Product ID / Sandbox ID)
product_id="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
sandbox_id="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
; From the product's deployment (Deployment ID)
deployment_id="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
; Client credentials (Client ID / Client Secret) for the deployment
client_id="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
client_secret="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
; Deployment encryption key (EOSG requires it; from the deployment's details)
encryption_key="0123456789abcdef0123456789abcdef"
; Dev Auth Tool local server (debug/editor builds only):
devtool_url="localhost:4545"
devtool_credential="PlayerOne"
; "" = auto: debug/editor builds log in with the Dev Auth Tool above,
; release builds create and log in with an anonymous Device ID.
; Override with "devtool" or "device".
auth_mode=""